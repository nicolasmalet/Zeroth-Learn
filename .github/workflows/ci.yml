name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra mnist
      - run: uv run --locked --extra mnist python -m unittest discover -s tests -v
      - run: uv run --locked --extra mnist python -c "import lab.mnist.experiments"
