[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroth-learn"
version = "0.2.6"
description = "Zeroth-order optimization for black-box models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "cycler",
]

[project.optional-dependencies]
mnist = ["scikit-learn"]

[project.urls]
Repository = "https://github.com/nicolasmalet/Zeroth-Learn"

[tool.setuptools.packages.find]
where = ["."]
include = ["zeroth*"]
exclude = ["lab*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"zeroth/all.py" = ["F403"]
"lab/mnist/neural_networks.py" = ["E741"]
